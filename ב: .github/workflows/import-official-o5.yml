
name: Import Official O5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-o5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import official O5 branch
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking if o5 already exists..."

          if git ls-remote --exit-code \
            --heads origin o5 >/dev/null 2>&1; then
            echo "Branch o5 already exists. Nothing changed."
            exit 1
          fi

          echo "Downloading official O5 branch..."

          git fetch \
            https://github.com/nightscout/AndroidAPS.git \
            refs/heads/o5

          echo "Creating o5 branch in my repository..."

          git push origin FETCH_HEAD:refs/heads/o5

          echo "SUCCESS! Official O5 imported."
          
