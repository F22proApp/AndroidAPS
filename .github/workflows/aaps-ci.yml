
name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version'
        required: true
        default: 'o5'
        type: choice
        options:
          # Development branches - JDK 21
          - o5
          - dev
          - o5-testing

          # AAPS 4.0
          - 4.0.0

          # AAPS 3.4
          - 3.4.2.6
          - 3.4.2.4
          - 3.4.2.3
          - 3.4.2.2
          - 3.4.2.1
          - 3.4.2.0
          - 3.4.1.0
          - 3.4.0.0

          # AAPS 3.3
          - 3.3.2.1
          - 3.3.2.0
          - 3.3.1.3

          # AAPS 3.2
          - 3.2.0.4
          - 3.2.0.3
          - 3.2.0.2
          - 3.2.0.1
          - 3.2.0.0

          # AAPS 3.1
          - 3.1.0.3
          - 3.1.0.2
          - 3.1.0.1
          - 3.1.0

          # AAPS 3.0
          - 3.0.0.2
          - 3.0.0.1
          - 3.0.0

      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Decode Secrets Keystore Set and Oauth2 to Env
        env:
          S_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          S_GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
        run: |
          set -e

          DELIM="AAPS_EOF_$(openssl rand -hex 16)"

          emit() {
            printf '%s<<%s\n%s\n%s\n' \
              "$1" "$DELIM" "$2" "$DELIM" >> "$GITHUB_ENV"
          }

          emit_masked() {
            if [ -n "$2" ]; then
              echo "::add-mask::$2"
            fi
            emit "$1" "$2"
          }

          if [ -n "$S_KEYSTORE_SET" ]; then
            echo "Decoding KEYSTORE_SET..."

            DECODED=$(printf '%s' "$S_KEYSTORE_SET" | base64 -d)

            emit_masked KEYSTORE_BASE64 \
              "$(printf '%s' "$DECODED" | cut -d'|' -f1)"

            emit_masked KEYSTORE_PASSWORD \
              "$(printf '%s' "$DECODED" | cut -d'|' -f2)"

            emit_masked KEY_ALIAS \
              "$(printf '%s' "$DECODED" | cut -d'|' -f3)"

            emit_masked KEY_PASSWORD \
              "$(printf '%s' "$DECODED" | cut -d'|' -f4)"

          else
            echo "Using separate keystore secrets."

            emit_masked KEYSTORE_BASE64 "$S_KEYSTORE_BASE64"
            emit_masked KEYSTORE_PASSWORD "$S_KEYSTORE_PASSWORD"
            emit_masked KEY_ALIAS "$S_KEY_ALIAS"
            emit_masked KEY_PASSWORD "$S_KEY_PASSWORD"
          fi

          emit_masked GDRIVE_OAUTH2 "$S_GDRIVE_OAUTH2"

          echo "Secrets preparation completed."

      - name: Check Secrets
        run: |
          set -e

          MISSING=0

          check_secret() {
            if [ -z "$1" ]; then
              echo "Missing secret: $2"
              MISSING=1
            fi
          }

          check_secret "$GDRIVE_OAUTH2" "GDRIVE_OAUTH2"
          check_secret "$KEYSTORE_BASE64" "KEYSTORE_BASE64"
          check_secret "$KEYSTORE_PASSWORD" "KEYSTORE_PASSWORD"
          check_secret "$KEY_ALIAS" "KEY_ALIAS"
          check_secret "$KEY_PASSWORD" "KEY_PASSWORD"

          if [ "$MISSING" -eq 1 ]; then
            echo "Required secrets are missing."
            exit 1
          fi

          echo "All required secrets are available."

      - name: Decode keystore file
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/keystore"

          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/keystore/keystore.jks"

          echo "Keystore file decoded."

      - name: Validate keystore and signing credentials
        run: |
          set -e

          echo "Validating keystore..."

          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          rm dummy.txt

          JARSIGNER_LOG=$(mktemp)

          if ! jarsigner \
              -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              dummy.jar "$KEY_ALIAS" \
              > "$JARSIGNER_LOG" 2>&1; then

            echo "Keystore validation failed."
            cat "$JARSIGNER_LOG"

            rm -f "$JARSIGNER_LOG" dummy.jar
            exit 1
          fi

          rm -f "$JARSIGNER_LOG" dummy.jar

          echo "Keystore and signing credentials validated."

      - name: Decode GDrive OAuth2 secrets
        run: |
          set -e

          DELIM="AAPS_EOF_$(openssl rand -hex 16)"

          emit_masked() {
            if [ -n "$2" ]; then
              echo "::add-mask::$2"
            fi

            printf '%s<<%s\n%s\n%s\n' \
              "$1" "$DELIM" "$2" "$DELIM" >> "$GITHUB_ENV"
          }

          DECODED=$(printf '%s' "$GDRIVE_OAUTH2" | base64 -d)

          emit_masked GDRIVE_CLIENT_ID \
            "$(printf '%s' "$DECODED" | cut -d'|' -f1)"

          emit_masked GDRIVE_REFRESH_TOKEN \
            "$(printf '%s' "$DECODED" | cut -d'|' -f2)"

          echo "Google Drive credentials decoded."

      - name: Retrieving Google Drive access token
        run: |
          set -e

          echo "Retrieving Google Drive access token..."

          TOKEN_RESPONSE=$(curl -sS -X POST \
            https://oauth2.googleapis.com/token \
            -d client_id="$GDRIVE_CLIENT_ID" \
            -d refresh_token="$GDRIVE_REFRESH_TOKEN" \
            -d grant_type=refresh_token)

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to obtain Google Drive access token."
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          echo "Google Drive authentication successful."

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch selected source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ github.event.inputs.tagName }}"

          echo "Selected source: $SOURCE"

          case "$SOURCE" in

            o5)
              echo "Fetching latest official Omnipod 5 beta..."

              git remote add upstream \
                https://github.com/nightscout/AndroidAPS.git || true

              git fetch upstream \
                +refs/heads/o5:refs/remotes/upstream/o5

              git checkout --detach refs/remotes/upstream/o5
              ;;

            dev)
              echo "Fetching latest official AAPS dev..."

              git remote add upstream \
                https://github.com/nightscout/AndroidAPS.git || true

              git fetch upstream \
                +refs/heads/dev:refs/remotes/upstream/dev

              git checkout --detach refs/remotes/upstream/dev
              ;;

            o5-testing)
              echo "Fetching personal O5 testing branch..."

              git remote add personal \
                https://github.com/F22proApp/AndroidAPS.git

              git fetch personal \
                +refs/heads/o5-testing:refs/remotes/personal/o5-testing

              git checkout --detach refs/remotes/personal/o5-testing
              ;;

            *)
              echo "Fetching official AAPS tag: $SOURCE"

              git remote add upstream \
                https://github.com/nightscout/AndroidAPS.git || true

              git fetch upstream \
                "refs/tags/$SOURCE:refs/tags/$SOURCE"

              git checkout --detach "refs/tags/$SOURCE"
              ;;

          esac

          echo "Source checkout completed."
          echo "Commit: $(git rev-parse HEAD)"

      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ github.event.inputs.tagName }}"

          if [[ "$SOURCE" == "o5" || "$SOURCE" == "o5-testing" ]]; then
            echo "Checking Omnipod 5 module..."

            grep -Fq \
              "include ':pump:omnipod:omnipod5'" \
              settings.gradle

            echo "Omnipod 5 module found."
          fi

          echo "Source verification completed."

      - name: Determine JVM version
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ github.event.inputs.tagName }}"

          case "$SOURCE" in
            o5|dev|o5-testing)
              JAVA_VERSION=21
              ;;

            *)
              JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)

              while IFS=$'\t' read -r pattern jdk; do
                if [[ "$SOURCE" == $pattern ]]; then
                  JAVA_VERSION="$jdk"
                  break
                fi
              done < <(
                jq -r \
                  '.mappings[] | "\(.pattern)\t\(.jdk)"' \
                  .github/jdk-map.json
              )
              ;;
          esac

          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"

          echo "Selected Java version: $JAVA_VERSION"

      - name: Set BUILD_VARIANT
        shell: bash
        run: |
          set -euo pipefail

          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"

          echo "BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"

          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" \
            | sed -E 's/(Release|Debug)$//' \
            | tr '[:upper:]' '[:lower:]')

          VARIANT_TYPE=$(echo "$BUILD_VARIANT" \
            | grep -oE '(Release|Debug)$' \
            | tr '[:upper:]' '[:lower:]')

          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> "$GITHUB_ENV"
          echo "VARIANT_TYPE=$VARIANT_TYPE" >> "$GITHUB_ENV"

          VERSION_SUFFIX=""

          if [[ "$VARIANT_FLAVOR" != "full" ]]; then
            VERSION_SUFFIX="$VARIANT_FLAVOR"
          fi

          if [[ "$VARIANT_TYPE" == "debug" ]]; then
            VERSION_SUFFIX="$VERSION_SUFFIX-debug"
          fi

          if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then
            VERSION_SUFFIX="-$VERSION_SUFFIX"
          fi

          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_ENV"

      - name: Extract VERSION
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ github.event.inputs.tagName }}"

          VERSION=$(grep -m1 'val appVersion' \
            buildSrc/src/main/kotlin/Versions.kt \
            | awk -F '"' '{print $2}')

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine application version."
            exit 1
          fi

          case "$SOURCE" in
            o5)
              VERSION="${VERSION}-o5"
              ;;
            dev)
              VERSION="${VERSION}-dev"
              ;;
            o5-testing)
              VERSION="${VERSION}-o5-testing"
              ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Building AAPS version: $VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APKs with version
        shell: bash
        run: |
          set -euo pipefail

          mv \
            app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}/*.apk \
            "aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"

          mv \
            wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}/*.apk \
            "aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"

          echo "APK files renamed."

      - name: Upload APKs to Google Drive
        shell: bash
        run: |
          set -euo pipefail

          echo "Start uploading APKs to Google Drive..."

          echo "Checking or creating AAPS folder..."

          AAPS_FOLDER_ID=$(curl -sS -X GET \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files?q=name='AAPS'+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false" \
            | jq -r '.files[0].id')

          if [[ "$AAPS_FOLDER_ID" == "null" || -z "$AAPS_FOLDER_ID" ]]; then

            AAPS_FOLDER_ID=$(curl -sS -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"AAPS","mimeType":"application/vnd.google-apps.folder"}' \
              "https://www.googleapis.com/drive/v3/files" \
              | jq -r '.id')

            echo "Created AAPS folder: $AAPS_FOLDER_ID"
          else
            echo "Found AAPS folder: $AAPS_FOLDER_ID"
          fi

          if [[ -z "$AAPS_FOLDER_ID" || "$AAPS_FOLDER_ID" == "null" ]]; then
            echo "Could not access AAPS folder."
            exit 1
          fi

          echo "Checking version folder: $VERSION"

          VERSION_FOLDER_ID=$(curl -sS -X GET \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files?q=name='${VERSION}'+and+mimeType='application/vnd.google-apps.folder'+and+'$AAPS_FOLDER_ID'+in+parents+and+trashed=false" \
            | jq -r '.files[0].id')

          if [[ "$VERSION_FOLDER_ID" == "null" || -z "$VERSION_FOLDER_ID" ]]; then

            VERSION_FOLDER_ID=$(curl -sS -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${VERSION}\",\"mimeType\":\"application/vnd.google-apps.folder\",\"parents\":[\"$AAPS_FOLDER_ID\"]}" \
              "https://www.googleapis.com/drive/v3/files" \
              | jq -r '.id')

            echo "Created version folder: $VERSION_FOLDER_ID"
          else
            echo "Found version folder: $VERSION_FOLDER_ID"
          fi

          if [[ -z "$VERSION_FOLDER_ID" || "$VERSION_FOLDER_ID" == "null" ]]; then
            echo "Could not access version folder."
            exit 1
          fi

          upload_to_gdrive() {
            FILE="$1"
            NAME="$2"

            if [[ ! -f "$FILE" ]]; then
              echo "File not found: $FILE"
              exit 26
            fi

            echo "Checking existing file: $NAME"

            QUERY="name='${NAME}' and '${VERSION_FOLDER_ID}' in parents and trashed=false"

            ENCODED_QUERY=$(python3 -c \
              "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

            FILE_ID=$(curl -sS \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files?q=${ENCODED_QUERY}&fields=files(id)" \
              | jq -r '.files[0].id')

            if [[ -n "$FILE_ID" && "$FILE_ID" != "null" ]]; then
              echo "Deleting existing file..."

              curl -sS -f -X DELETE \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://www.googleapis.com/drive/v3/files/${FILE_ID}"
            fi

            echo "Uploading $NAME..."

            HTTP_CODE=$(curl -sS \
              -w "%{http_code}" \
              -o /tmp/gdrive_response.json \
              -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -F "metadata={\"name\":\"$NAME\",\"parents\":[\"$VERSION_FOLDER_ID\"]};type=application/json;charset=UTF-8" \
              -F "file=@$FILE;type=application/vnd.android.package-archive" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")

            if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
              echo "Upload failed with HTTP status: $HTTP_CODE"
              cat /tmp/gdrive_response.json
              exit 1
            fi

            echo "Uploaded: $NAME"
          }

          upload_to_gdrive \
            "aaps-${VERSION}${VERSION_SUFFIX}.apk" \
            "aaps-${VERSION}${VERSION_SUFFIX}.apk"

          upload_to_gdrive \
            "aaps-wear-${VERSION}${VERSION_SUFFIX}.apk" \
            "aaps-wear-${VERSION}${VERSION_SUFFIX}.apk"

          echo "All APKs uploaded to Google Drive."

  cleanup:
    name: Cleanup Old Workflow Runs
    needs: build
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-workflow-runs.yml
    with:
      workflow_name: 'AAPS CI'
      keep_runs: 20
      keep_threshold: 5
      
